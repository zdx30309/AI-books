services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - backend_output:/app/backend/output
      - ./external_reference_assets:/app/backend/external_reference_assets:ro
    environment:
      COVER_ORTHODOX_REFERENCE_ZIP_PATH: /app/backend/external_reference_assets/orthodox_publishing/reference_covers.zip
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - backend_output:/app/backend/output
      - ./external_reference_assets:/app/backend/external_reference_assets:ro
    environment:
      COVER_ORTHODOX_REFERENCE_ZIP_PATH: /app/backend/external_reference_assets/orthodox_publishing/reference_covers.zip
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "celery_app.celery_app",
        "worker",
        "--pool=threads",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-12}",
        "--loglevel=info",
        "--without-gossip",
        "--without-mingle",
        "--without-heartbeat"
      ]

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - backend_output:/app/backend/output
      - ./external_reference_assets:/app/backend/external_reference_assets:ro
    environment:
      COVER_ORTHODOX_REFERENCE_ZIP_PATH: /app/backend/external_reference_assets/orthodox_publishing/reference_covers.zip
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "celery_app.celery_app",
        "beat",
        "--loglevel=info"
      ]

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  backend_output:
