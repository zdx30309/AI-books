services:
  redis-gate:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - backend_output:/app/backend/output
      - ./external_reference_assets:/app/backend/external_reference_assets:ro
      - ${GOOGLE_ADC_HOST_DIR:-./.local/google}:/root/.config/gcloud:ro
    environment:
      COVER_ORTHODOX_REFERENCE_ZIP_PATH: /app/backend/external_reference_assets/orthodox_publishing/reference_covers.zip
      WEREAD_COMPANY_INDEX_PATH: /app/backend/output/weread_company_index.json
      PAID_API_GATE_REDIS_URL: redis://redis-gate:6379/0
      # Never allow a paid call when the shared breaker cannot be verified.
      # An explicit environment value may override this default, but a
      # missing production .env entry remains fail-closed.
      PAID_API_GUARD_FAIL_CLOSED: ${PAID_API_GUARD_FAIL_CLOSED:-True}
      LONG_NOVEL_PROMPT_CACHE_WARMUP: ${LONG_NOVEL_PROMPT_CACHE_WARMUP:-False}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/root/.config/gcloud/application_default_credentials.json}
      CELERY_BROKER_URL: redis://redis-gate:6379/1
      CELERY_RESULT_BACKEND: redis://redis-gate:6379/2
    depends_on:
      redis-gate:
        condition: service_healthy
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - backend_output:/app/backend/output
      - ./external_reference_assets:/app/backend/external_reference_assets:ro
      - ${GOOGLE_ADC_HOST_DIR:-./.local/google}:/root/.config/gcloud:ro
    environment:
      COVER_ORTHODOX_REFERENCE_ZIP_PATH: /app/backend/external_reference_assets/orthodox_publishing/reference_covers.zip
      WEREAD_COMPANY_INDEX_PATH: /app/backend/output/weread_company_index.json
      PAID_API_GATE_REDIS_URL: redis://redis-gate:6379/0
      PAID_API_GUARD_FAIL_CLOSED: ${PAID_API_GUARD_FAIL_CLOSED:-True}
      LONG_NOVEL_PROMPT_CACHE_WARMUP: ${LONG_NOVEL_PROMPT_CACHE_WARMUP:-False}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/root/.config/gcloud/application_default_credentials.json}
      CELERY_BROKER_URL: redis://redis-gate:6379/1
      CELERY_RESULT_BACKEND: redis://redis-gate:6379/2
    depends_on:
      redis-gate:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "celery_app.celery_app",
        "worker",
        "--pool=threads",
        "--concurrency=${CELERY_WORKER_CONCURRENCY:-12}",
        "--loglevel=info",
        "--without-gossip",
        "--without-mingle",
        "--without-heartbeat"
      ]

  beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    restart: unless-stopped
    volumes:
      - backend_output:/app/backend/output
      - ./external_reference_assets:/app/backend/external_reference_assets:ro
      - ${GOOGLE_ADC_HOST_DIR:-./.local/google}:/root/.config/gcloud:ro
    environment:
      COVER_ORTHODOX_REFERENCE_ZIP_PATH: /app/backend/external_reference_assets/orthodox_publishing/reference_covers.zip
      WEREAD_COMPANY_INDEX_PATH: /app/backend/output/weread_company_index.json
      PAID_API_GATE_REDIS_URL: redis://redis-gate:6379/0
      PAID_API_GUARD_FAIL_CLOSED: ${PAID_API_GUARD_FAIL_CLOSED:-True}
      LONG_NOVEL_PROMPT_CACHE_WARMUP: ${LONG_NOVEL_PROMPT_CACHE_WARMUP:-False}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/root/.config/gcloud/application_default_credentials.json}
      CELERY_BROKER_URL: redis://redis-gate:6379/1
      CELERY_RESULT_BACKEND: redis://redis-gate:6379/2
    depends_on:
      redis-gate:
        condition: service_healthy
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "celery_app.celery_app",
        "beat",
        "--loglevel=info"
      ]

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  backend_output:
